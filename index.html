<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dispatch — Feed</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="masthead-title">Disp<span>atch</span></div>
    <nav class="masthead-nav" id="nav-slot"></nav>
  </div>
</header>

<main>
  <section class="composer">
    <form id="post-form">
      <textarea id="post-content" maxlength="2000" placeholder="What's happening?" required></textarea>
      <div class="composer-row">
        <span class="composer-hint">Text only, up to 2000 characters.</span>
        <button type="submit" class="btn btn-signal" id="post-submit-btn">Post</button>
      </div>
    </form>
  </section>

  <div class="feed-tabs">
    <button class="feed-tab active" data-mode="all">Everyone</button>
    <button class="feed-tab" data-mode="following">Following</button>
  </div>

  <div id="error-slot"></div>
  <div id="feed-list"><div class="loading-state">Loading feed…</div></div>
</main>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/feed.js"></script>
</body>
</html>
