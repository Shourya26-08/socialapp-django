<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Dispatch</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="masthead-title">Disp<span>atch</span></div>
    <nav class="masthead-nav" id="nav-slot"></nav>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <h1 class="auth-title">Welcome <span>back</span></h1>
    <p class="auth-subtitle">Log in to see your feed.</p>

    <div id="form-error"></div>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-signal" id="submit-btn">Log in</button>
    </form>

    <p class="auth-switch">No account yet? <a href="register.html">Create one</a></p>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>
  renderNav('login');
  if (Api.isLoggedIn()) window.location.href = 'index.html';

  const form = document.getElementById('login-form');
  const errorSlot = document.getElementById('form-error');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorSlot.innerHTML = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';
    try {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const data = await Api.login(username, password);
      Api.setToken(data.token);
      Api.setUsername(data.username);
      window.location.href = 'index.html';
    } catch (err) {
      showError(errorSlot, err);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
