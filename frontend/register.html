<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up — Dispatch</title><link rel="stylesheet" href="css/style.css"></head><body><header class="masthead"><div class="masthead-inner"><div class="masthead-title">Disp<span>atch</span></div><nav id="nav-slot"></nav></div></header><main><div class="auth-wrap"><h1 class="auth-title">Join <span>Dispatch</span></h1><p class="auth-subtitle">Create an account to start posting.</p><div id="form-error"></div><form id="register-form"><div class="field"><label>Username</label><input id="username" required minlength="2" maxlength="30"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="8"></div><div class="field"><label>Short bio</label><input id="bio" maxlength="280"></div><button class="btn btn-signal" id="submit-btn">Create account</button></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></div></main><script src="js/api.js"></script><script src="js/ui.js"></script><script>renderNav('register');if(Api.isLoggedIn())location.href='index.html';document.getElementById('register-form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit-btn');try{b.disabled=true;const d=await Api.register(username.value.trim(),email.value.trim(),password.value,bio.value.trim());Api.setToken(d.token);Api.setUsername(d.username);location.href='index.html'}catch(x){showError(document.getElementById('form-error'),x)}finally{b.disabled=false}})</script></body></html>
