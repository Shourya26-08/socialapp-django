<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — Dispatch</title><link rel="stylesheet" href="css/style.css"></head><body><header class="masthead"><div class="masthead-inner"><div class="masthead-title">Disp<span>atch</span></div><nav id="nav-slot"></nav></div></header><main><div class="auth-wrap"><h1 class="auth-title">Welcome <span>back</span></h1><p class="auth-subtitle">Log in to see your feed.</p><div id="form-error"></div><form id="login-form"><div class="field"><label>Username</label><input id="username" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn btn-signal" id="submit-btn">Log in</button></form><p class="auth-switch">No account yet? <a href="register.html">Create one</a></p></div></main><script src="js/api.js"></script><script src="js/ui.js"></script><script>renderNav('login');if(Api.isLoggedIn())location.href='index.html';document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit-btn');try{b.disabled=true;const d=await Api.login(username.value.trim(),password.value);Api.setToken(d.token);Api.setUsername(d.username);location.href='index.html'}catch(x){showError(document.getElementById('form-error'),x)}finally{b.disabled=false}})</script></body></html>
